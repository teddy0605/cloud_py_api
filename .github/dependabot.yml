# Dependabot opens pull requests when dependencies have new versions.
# - cooldown: wait 7 days after a release before proposing it, so a compromised or broken
#   release is usually caught (and pulled) by others first. Security fixes ignore cooldown.
# - groups: one PR per ecosystem instead of one PR per package; security updates are grouped
#   separately (applies-to: security-updates) so alerts produce one PR, not one per advisory.
# npm and pip PRs (and GitHub-owned action bumps) merge automatically once CI, the
# supply-chain checks and the Nextcloud integration test pass
# (.github/workflows/dependabot-auto-merge.yml). Red PRs and third-party actions stay open.
version: 2
updates:
  # Keeps the SHA pins in .github/workflows/*.yml current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]

  # Frontend build dependencies (package.json / package-lock.json).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    # The frontend is Vue 2. Vue 3 and the Nextcloud libraries built on it need a code
    # migration, not a version bump, so their major versions are not proposed.
    ignore:
      - dependency-name: "vue"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vuex"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vue-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nextcloud/vue"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nextcloud/dialogs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nextcloud/password-confirmation"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # Python: nc_py_api's dependencies (setup.cfg) and the CI tools in .github/ci-requirements.txt.
  - package-ecosystem: pip
    directories: [/, /.github]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      pip:
        applies-to: version-updates
        patterns: ["*"]
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
