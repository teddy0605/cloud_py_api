# Continuous integration for cloud_py_api.
#
# Security notes (see GitHub's "Security hardening for GitHub Actions"):
# - Only `push` (to main) and `pull_request` triggers. Never `pull_request_target`:
#   it runs fork PRs with a write token and secrets.
# - Every `uses:` is pinned to a full commit SHA (tags can be moved; SHAs cannot).
#   The comment after the SHA is the release it points to. Dependabot keeps them current.
# - `permissions: {}` removes all GITHUB_TOKEN rights by default; each job asks only for
#   what it needs (here: read the code).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# A newer push to the same branch/PR cancels the older, still running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Official PHP images, pinned by digest so the job is reproducible.
        # To update: look up the new digest of the tag and replace it (manual).
        include:
          - php: "8.3"
            image: php:8.3-cli@sha256:f1ed6d1fd0aa769ab94ca307b9deaf55fbc18434315b70e319cd79078515cd2b
          - php: "8.4"
            image: php:8.4-cli@sha256:0177c7589c0715b63e5343342a7c1f1887db759ad0b0d6ad3bb949938bba6b47
          - php: "8.5"
            image: php:8.5-cli@sha256:19642e172d3a542225225e202ddc2c11f67bdcbddf147b676c49338609b9290f
    # The whole job runs inside the PHP container, so no third-party setup action is needed.
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the token in .git/config for later steps.
          persist-credentials: false
      - name: php -l on every PHP file
        run: |
          php --version
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 php -l

  frontend:
    name: JS lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
      # Install scripts must run here (vue-demi patches itself in postinstall), so no
      # --ignore-scripts. The job has no secrets and a read-only token.
      - run: npm ci --no-audit --no-fund
      # Registry signatures and provenance of every installed package.
      - run: npm audit signatures
      - run: npm run lint
      # js/ is not committed in this repo; releases are built by release.yml.
      - run: npm run build
      # Same packaging as release.yml, so a broken package shows up before a tag is pushed.
      - name: Package (dry run)
        run: .github/scripts/package-release.sh "$RUNNER_TEMP/dist"

  python:
    name: Python (nc_py_api)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13" # same as the Nextcloud Docker image that uses nc_py_api
      - name: Install tools
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check -q -r .github/ci-requirements.txt
      # Only real errors fail the build: syntax errors and undefined names.
      - name: ruff (errors only)
        run: '"$RUNNER_TEMP/venv/bin/ruff" check --select E9,F63,F7,F82 --output-format github .'
      - name: Byte-compile
        run: '"$RUNNER_TEMP/venv/bin/python" -m compileall -q nc_py_api setup.py tests'
      # tests/nc_py_api need a running Nextcloud with a database (they call occ and query
      # the DB), so they are not run here.

  # The app in a real Nextcloud (official image + MariaDB), with MediaDC as the client
  # app: the cloud_py_api tarball of this commit plus the attested MediaDC release, then
  # MediaDC's smoke test (apps enable, pages and bundles load, duplicate scan).
  nextcloud:
    name: Nextcloud integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      # MediaDC release installed for the test, and the MediaDC commit whose
      # .github/scripts/nextcloud-smoke.sh (and test images) are used.
      MEDIADC_TAG: v0.6.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: teddy0605/mediadc
          ref: 75fcbb77cbb504540e1a41bb7fa971a6d3cf0f5d
          path: mediadc-src
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
      # Install scripts must run (vue-demi postinstall), as in the frontend job.
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Package cloud_py_api
        run: .github/scripts/package-release.sh "$RUNNER_TEMP/cloud_py_api"
      - name: Download and verify MediaDC
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$MEDIADC_TAG" -R teddy0605/mediadc -D "$RUNNER_TEMP/mediadc"
          (cd "$RUNNER_TEMP/mediadc" && sha256sum -c SHA256SUMS)
          gh attestation verify "$RUNNER_TEMP"/mediadc/mediadc-*.tar.gz -R teddy0605/mediadc \
            --signer-workflow teddy0605/mediadc/.github/workflows/release.yml \
            --source-ref "refs/tags/$MEDIADC_TAG"
      - name: Smoke test in Nextcloud
        working-directory: mediadc-src
        run: .github/scripts/nextcloud-smoke.sh "$RUNNER_TEMP/mediadc" "$RUNNER_TEMP/cloud_py_api"

  # Pull requests only: what a dependency change brings in. Dependabot PRs are auto-merged
  # only when this job passes (see dependabot-auto-merge.yml and the "protect main" ruleset).
  supply-chain:
    name: Supply chain
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Fails on known high or critical vulnerabilities in dependencies the PR adds or
      # changes. Uses GitHub's dependency graph.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: package-lock.json checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/check-lockfile.sh "$BASE_SHA"

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check -q -r .github/ci-requirements.txt
      # zizmor audits the workflows themselves (injection, unpinned actions, excessive
      # permissions, ...). The read-only token lets it check pins against GitHub.
      - name: Report all findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/venv/bin/zizmor" --no-exit-codes .github/workflows'
      - name: Fail on high-severity findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/venv/bin/zizmor" --min-severity high .github/workflows'
